name: CI
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production dependencies with a known high or critical advisory fail the build.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      # The packages outside teams install must build.
      - run: pnpm --filter @skeinlabs/sdk --filter @skeinlabs/mcp build
      # The SDK as an outside developer installs it (plain npm): every entry point
      # imports, and the packaged Telegraph client signs the node's live
      # multi-chain 402 and asks FRAUD_RISK_GENERAL on miner 845301.
      - run: node packages/sdk/scripts/check-pack.mjs --no-build
      # The integration example typechecks against that packed SDK.
      - name: listing-gate example typechecks against the packed SDK
        run: |
          set -eu
          out=$(mktemp -d)
          (cd packages/sdk && pnpm pack --pack-destination "$out" >/dev/null)
          cp -r examples/listing-gate "$out/example"
          cd "$out/example"
          npm install --no-audit --no-fund --no-package-lock "$out"/skeinlabs-sdk-*.tgz viem@2.57.5 @types/node@22.20.5 typescript@5.9.3 >/dev/null
          npx tsc --noEmit
      # A version already on npm must match its published bytes (a forgotten bump
      # would ship different code under the same number). Warning only: builds
      # are not guaranteed byte-reproducible across tool versions.
      - run: node packages/sdk/scripts/check-published.mjs packages/sdk --no-build && node packages/sdk/scripts/check-published.mjs packages/mcp --no-build
        continue-on-error: true
      # Skein Desk deploys from Netlify, which does not wait for CI: build it here so a break never reaches production unseen.
      - run: pnpm --filter @skein/desk build
      # Spec section 14: every stored verdict replays to the same hash with the engine that sealed it,
      # the simulated fixtures and every real evaluation run.
      - run: pnpm repro eval/verdicts
      - run: pnpm repro eval/runs
      # The property tests at the depth DECISIONS D8 claims.
      - run: FC_RUNS=20000 pnpm --filter @skein/engine exec vitest run test/properties.test.ts --testTimeout=900000

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --with-deps installs system packages through apt. When Ubuntu's mirrors
      # are unreachable from the runner (as on 2026-11-11), fall back to the
      # browser alone: the runner image already ships Chrome's libraries.
      - name: Install Chromium for Playwright
        run: pnpm --filter @skein/e2e exec playwright install --with-deps chromium || pnpm --filter @skein/e2e exec playwright install chromium
      - run: pnpm --filter @skein/web build
        env:
          NEXT_PUBLIC_SKEIN_API: http://localhost:8787
      - name: Start the web app
        run: (cd apps/web && npx next start -p 3000 &) && npx wait-on@8.0.4 http://localhost:3000 --timeout 60000
        env:
          NEXT_PUBLIC_SKEIN_API: http://localhost:8787
      # The console flow, verify, 375 px and axe (WCAG 2 A/AA), against the simulated API.
      - run: pnpm --filter @skein/e2e e2e

  # A smaller version of docs/LOADTEST.md on every build: two API replicas on a
  # real PostgreSQL, runtime queries as skein_app, simulated Telegraph nodes
  # (nothing paid). Fails if any money or idempotency invariant breaks.
  loadtest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: skein
        ports: ["5432:5432"]
        options: >-
          --name pg --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Raise max_connections (two replica pools plus the owner's)
        run: |
          docker exec pg psql -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart pg
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
      - run: pnpm --filter @skein/api exec tsx scripts/loadtest.ts
        timeout-minutes: 15
        env:
          LOADTEST_BURST: "100"
          LOADTEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/skein
