name: Prospective benchmark
# Every day: label the launches the sniper checked at least 72 hours ago by what
# happened to them after the verdict (eval/src/label.ts), import the verdicts it
# bought before the outcome, and score them. The cases, runs and report live on
# the data/prospective branch, so this never pushes to main or redeploys anything.
# Nothing is bought: the verdicts already exist, and labels come from public
# DEX Screener data. eval/README.md explains the method.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

# Jobs set their own permissions; nothing by default.
permissions: {}

concurrency:
  group: prospective
  cancel-in-progress: false

jobs:
  label-and-score:
    # Installs and runs repository code, so it gets a read-only token. Its
    # output goes to the publish job as an artifact; only that job, which
    # installs nothing, can write.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A failed benchmark must not mark main's head commit red: Railway's "wait
    # for CI" counts every check suite there and would skip the next deploy.
    # The failure still shows on the run and in the job summary.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore the data branch
        run: |
          set -eu
          if git fetch --depth=1 origin data/prospective 2>/dev/null; then
            git worktree add ../data FETCH_HEAD --detach
          else
            mkdir -p ../data && git -C ../data init -q
          fi
          mkdir -p ../data/runs
          [ -f ../data/prospective.json ] && cp ../data/prospective.json eval/sources/prospective.json || true
          mkdir -p eval/runs-prospective && cp -r ../data/runs/. eval/runs-prospective/ 2>/dev/null || true
      - name: Label launches checked 72 hours ago or more
        run: pnpm --filter @skein/eval eval-tools prospective eval/sources/prospective.json
      - name: Import the verdicts bought before the outcome
        run: |
          if [ -f eval/sources/prospective.json ]; then
            pnpm --filter @skein/eval eval import eval/sources/prospective.json --out eval/runs-prospective
          fi
      - name: Score
        run: |
          set -eu
          if [ -f eval/sources/prospective.json ] && [ -n "$(ls -A eval/runs-prospective 2>/dev/null)" ]; then
            pnpm --silent --filter @skein/eval eval report eval/sources/prospective.json eval/runs-prospective > ../report.md
          else
            printf '# Prospective benchmark\n\nNo launch has reached its 72-hour outcome yet.\n' > ../report.md
          fi
          cat ../report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Stage the data branch content
        run: |
          set -eu
          mkdir -p ../out/runs
          cp eval/sources/prospective.json ../out/prospective.json 2>/dev/null || true
          cp -r eval/runs-prospective/. ../out/runs/ 2>/dev/null || true
          cp ../report.md ../out/REPORT.md
          printf '# Skein prospective benchmark data\n\nWritten daily by .github/workflows/prospective.yml on main. See REPORT.md.\n' > ../out/README.md
          mv ../out ./prospective-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prospective
          path: prospective-out
          retention-days: 3

  publish:
    needs: label-and-score
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with write access: it checks out nothing, installs nothing
    # and runs no repository code; it commits the artifact to data/prospective.
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prospective
          path: out
      - name: Publish to data/prospective
        run: |
          set -eu
          git init -q data && cd data
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin data/prospective 2>/dev/null; then git checkout -q -B data FETCH_HEAD; else git checkout -q --orphan data; fi
          rm -rf runs && cp -r ../out/. .
          git config user.name "skein-prospective"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Prospective benchmark: $(date -u +%F)"
          git push origin HEAD:refs/heads/data/prospective
