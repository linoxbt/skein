name: Release packages
# Publishes @skeinlabs/sdk and @skeinlabs/mcp to npm with provenance.
# Run it from the Actions tab (Run workflow), or push a tag like v0.1.0.
# pnpm publish -r skips any package whose version is already on npm, so
# re-running after a partial release only publishes what is missing.
#
# Authentication: the repository secret NPM_TOKEN (a granular token for the
# @skeinlabs scope); npm holds each token-published version until the owner
# approves it with 2FA. The job runs in the "npm" environment, so required
# reviewers set on that environment gate every publish. Moving to npm trusted
# publishing (OIDC) needs the packages linked on npmjs.com first, and npm 11.5+
# in this job; see docs/guides/OWNER_STEPS.md.
#
# Run it only on a commit Railway has already deployed: Railway's "wait for CI"
# counts every check suite on a commit, so a failed release run would make it
# skip that commit's deploy.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and check only; publish nothing"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # A tag names the version it publishes: v0.3.1 must match both package.json files.
      - name: Tag matches package versions
        if: github.ref_type == 'tag'
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          for p in packages/sdk packages/mcp; do
            have=$(node -p "require('./$p/package.json').version")
            [ "$have" = "$want" ] || { echo "::error::$p is $have, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: pnpm --filter @skeinlabs/sdk --filter @skeinlabs/mcp typecheck
      - run: pnpm --filter @skeinlabs/sdk --filter @skeinlabs/mcp test
      - run: pnpm --filter @skeinlabs/sdk --filter @skeinlabs/mcp build
      - run: node packages/sdk/scripts/check-pack.mjs --no-build
      # Refuses to go on when this version is already on npm with different bytes.
      - run: node packages/sdk/scripts/check-published.mjs packages/sdk --no-build && node packages/sdk/scripts/check-published.mjs packages/mcp --no-build
      - name: Publish
        run: pnpm --filter @skeinlabs/sdk --filter @skeinlabs/mcp publish -r --access public --no-git-checks ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
