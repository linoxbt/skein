# Skein Desk on Netlify, built from the repository (pnpm workspace).
# In the Netlify UI: Base directory = apps/desk. The build runs from the repo
# root so the workspace packages resolve. Set SKEIN_API_URL, DESK_SKEIN_KEY
# and DESK_CRON_SECRET in the Netlify UI (never here), and for the Telegraph
# rail DESK_PAYER=telegraph and DESK_PAYER_KEY (the other settings are listed
# in lib/desk.ts). docs/RUNBOOK.md has the deploy steps.
#
# Functions (netlify/functions, found by convention):
#   desk-tick              scheduled every minute; starts the background agent
#   desk-agent-background  the agent's run: intake, then every open application
#                          (a background function, up to 15 minutes, so a paid
#                          Telegraph ask is never cut off). Its source is
#                          netlify/agent/desk-agent-background.mts; the build
#                          (pnpm build:functions) bundles it, with the workspace
#                          SDK, telegraph and engine code, into one .mjs here.
[build]
  command = "cd ../.. && corepack enable && pnpm install --frozen-lockfile && pnpm --filter @skein/desk... build"
  publish = ".next"

# The agent imports workspace packages whose exports point at TypeScript
# source (@skeinlabs/sdk -> src/index.ts). Netlify's packager left them as
# imports, even with node_bundler = "esbuild", and Node cannot load .ts at run
# time: every background run failed with ERR_MODULE_NOT_FOUND (Nov 14). So the
# build bundles the agent into a self-contained file first (see above).
[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
